name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Apps to build
        type: choice
        options: [all, desktop, android]
        default: all

permissions:
  contents: write

jobs:
  changes:
    # Decide which apps this push affects, and fix the release version for all of them.
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.targets.outputs.desktop }}
      android: ${{ steps.targets.outputs.android }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            desktop:
              - "src/**"
              - "src-tauri/**"
              - "static/**"
              - "scripts/**"
              - "tests/**"
              - "package.json"
              - "package-lock.json"
              - "svelte.config.js"
              - "vite.config.js"
              - "tsconfig.json"
              - "python-backend/**"
            android:
              # The APK bundles python-backend, so backend changes ship in both apps.
              - "android/**"
              - "python-backend/**"
              - ".github/workflows/android.yml"
            workflow:
              - ".github/workflows/release.yml"

      - name: Choose apps
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TARGET: ${{ inputs.target }}
          DESKTOP: ${{ steps.filter.outputs.desktop }}
          ANDROID: ${{ steps.filter.outputs.android }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            desktop=$([ "$TARGET" != "android" ] && echo true || echo false)
            android=$([ "$TARGET" != "desktop" ] && echo true || echo false)
          elif [ "$REF_TYPE" = "tag" ] || [ "$WORKFLOW" = "true" ]; then
            # Explicit version tags and release pipeline changes build everything.
            desktop=true
            android=true
          else
            desktop=${DESKTOP:-false}
            android=${ANDROID:-false}
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "### Release targets" >> "$GITHUB_STEP_SUMMARY"
          echo "desktop: $desktop · android: $android" >> "$GITHUB_STEP_SUMMARY"

      - name: Set release version
        id: version
        if: steps.targets.outputs.desktop == 'true' || steps.targets.outputs.android == 'true'
        run: node scripts/release-version.mjs

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            backend_name: ytmd-backend-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend deps
        run: npm ci

      - name: Validate frontend
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/installer-shutdown.test.ps1

      - name: Set release version
        id: version
        shell: bash
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          node -e "
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.version = process.env.VERSION;
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write Last.fm secrets
        shell: bash
        env:
          LASTFM_SECRETS_JSON: ${{ secrets.LASTFM_SECRETS_JSON }}
        run: |
          if [ -n "$LASTFM_SECRETS_JSON" ]; then
            printf '%s' "$LASTFM_SECRETS_JSON" > src-tauri/lastfm.secrets.json
          else
            cp lastfm.secrets.json.example src-tauri/lastfm.secrets.json
          fi

      - name: Build Python sidecar
        shell: bash
        run: |
          python -m venv python-backend/.venv
          source python-backend/.venv/Scripts/activate
          pip install -r python-backend/requirements.txt pyinstaller
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/setup-playback.py
          mkdir -p src-tauri/binaries
          pyinstaller --noconfirm --onefile \
            --name ytmd-backend-x86_64-pc-windows-msvc \
            --distpath src-tauri/binaries \
            --workpath python-backend/build_tmp \
            --specpath python-backend/build_tmp \
            --hidden-import=ytmusicapi \
            --hidden-import=flask \
            --hidden-import=flask_cors \
            --hidden-import=yt_dlp \
            --hidden-import=pykakasi \
            --collect-all ytmusicapi \
            --collect-all yt_dlp \
            --collect-all yt_dlp_ejs \
            --collect-all yt_dlp_plugins \
            --copy-metadata bgutil-ytdlp-pot-provider \
            --collect-all pykakasi \
            python-backend/server.py
          src-tauri/binaries/ytmd-backend-x86_64-pc-windows-msvc.exe --check-playback
          # Ship sidecar next to resources so the installed app can find it
          cp "src-tauri/binaries/${{ matrix.backend_name }}" \
            "src-tauri/binaries/ytmd-backend.exe"
          mkdir -p src-tauri/resources
          cp "src-tauri/binaries/ytmd-backend.exe" src-tauri/resources/ytmd-backend.exe

      - name: Patch bundle resources for sidecar
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.bundle.resources = j.bundle.resources || [];
          if (!j.bundle.resources.includes('resources/ytmd-backend.exe')) {
            j.bundle.resources.push('resources/ytmd-backend.exe');
          }
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: YTMD Lite ${{ steps.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            ## YTMD Lite

            Custom YouTube Music desktop client (Tauri 2).

            Windows installers include the Python API backend.
            The Android APK (`YTMD-Lite_<version>_android.apk`) bundles the same backend.
            Built from commit ${{ github.sha }}.

            Signed installers and latest.json are available through the auto-updater.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

  android:
    needs: [changes, desktop]
    # Runs whether or not the desktop build was needed, but never after it failed.
    if: >-
      always() && needs.changes.outputs.android == 'true' &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.changes.outputs.version }}
      release-tag: ${{ needs.changes.outputs.tag }}
    secrets: inherit

  finalize:
    # Publish only after every built app's assets are on the draft release.
    needs: [changes, desktop, android]
    if: >-
      always() &&
      (needs.desktop.result == 'success' || needs.android.result == 'success') &&
      needs.desktop.result != 'failure' && needs.desktop.result != 'cancelled' &&
      needs.android.result != 'failure' && needs.android.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changes.outputs.tag }}
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
          DESKTOP_BUILT: ${{ needs.desktop.result == 'success' }}
        run: |
          make_latest=false
          # The desktop auto-updater reads releases/latest/download/latest.json, so only a release
          # with desktop installers may become Latest — and a slower older build must not replace a newer one.
          if [ "$DESKTOP_BUILT" = "true" ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name) || { echo "Could not check the current stable release"; exit 1; }
            latest=${latest#v}
            newest=$(printf '%s\n' "$latest" "$RELEASE_VERSION" | sort -V | tail -n1)
            if [ "$RELEASE_VERSION" != "$latest" ] && [ "$newest" = "$RELEASE_VERSION" ]; then
              make_latest=true
            fi
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false "--latest=$make_latest"
